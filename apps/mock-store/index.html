<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chai Corner</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2328; background: #f6f7f9; }
  header { background: #fff; border-bottom: 1px solid #e3e6ea; padding: 14px 20px; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 20px; margin: 0; flex: 1; color: #b4501e; }
  main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: #5c6570; font-size: 14px; }
  input { width: 100%; padding: 12px; border: 1px solid #c9ced5; border-radius: 8px; font: inherit; margin-bottom: 12px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #b4501e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: #b4501e; border: 1px solid #b4501e; }
  .total { font-size: 20px; font-weight: 600; }
  .qr { display: block; width: 100%; max-width: 340px; margin: 12px auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Chai Corner</h1>
  <button id="cart-button" class="ghost" aria-label="Open cart">Cart (<span id="cart-count">0</span>)</button>
</header>
<main>
  <section id="menu">
    <input id="search" type="search" placeholder="Search the menu" aria-label="Search the menu">
    <div id="items"></div>
  </section>

  <section id="cart" hidden>
    <h2>Your cart</h2>
    <div id="cart-lines"></div>
    <div class="card row"><span>Total</span><span class="total" id="cart-total"></span></div>
    <button id="checkout">Proceed to payment</button>
    <button id="back" class="ghost">Back to menu</button>
  </section>

  <section id="payment" hidden>
    <h2>Pay with UPI</h2>
    <div class="card">
      <div class="row"><span>Amount to pay</span><span class="total" id="pay-total"></span></div>
      <p class="muted">Scan with any UPI app and enter the amount shown.</p>
      <img class="qr" src="upi.png" alt="UPI payment QR code">
    </div>
  </section>
</main>
<script>
  // A deliberately ordinary checkout: the QR is only an image and carries no amount, as on a real site.
  // Nothing here knows about RupeeRail or the agent.
  const MENU = [
    { id: "cutting", name: "Cutting chai", note: "Small glass", paise: 100 },
    { id: "masala", name: "Masala chai", note: "Large cup", paise: 2000 },
    { id: "bun", name: "Bun maska", note: "Buttered bun", paise: 3000 },
  ];
  const rupees = (paise) => "₹" + (paise / 100).toFixed(paise % 100 ? 2 : 0);
  const cart = new Map();
  const $ = (id) => document.getElementById(id);
  const total = () => [...cart].reduce((sum, [id, n]) => sum + MENU.find((m) => m.id === id).paise * n, 0);
  const show = (name) => ["menu", "cart", "payment"].forEach((s) => { $(s).hidden = s !== name; });

  function line(text, note, right) {
    const card = document.createElement("div");
    card.className = "card row";
    const left = document.createElement("div");
    left.textContent = text;
    const small = document.createElement("div");
    small.className = "muted";
    small.textContent = note;
    left.append(small);
    card.append(left, right);
    return card;
  }

  function renderMenu() {
    const query = $("search").value.trim().toLowerCase();
    $("items").replaceChildren(...MENU.filter((m) => m.name.toLowerCase().includes(query)).map((m) => {
      const add = document.createElement("button");
      add.textContent = "Add";
      add.setAttribute("aria-label", `Add ${m.name}`);
      add.onclick = () => {
        cart.set(m.id, (cart.get(m.id) ?? 0) + 1);
        $("cart-count").textContent = [...cart.values()].reduce((a, b) => a + b, 0);
      };
      return line(`${m.name} · ${rupees(m.paise)}`, m.note, add);
    }));
  }

  function renderCart() {
    $("cart-lines").replaceChildren(...[...cart].map(([id, n]) => {
      const m = MENU.find((item) => item.id === id);
      const price = document.createElement("span");
      price.textContent = rupees(m.paise * n);
      return line(`${m.name} × ${n}`, m.note, price);
    }));
    $("cart-total").textContent = rupees(total());
  }

  $("search").oninput = renderMenu;
  $("cart-button").onclick = () => { renderCart(); show("cart"); };
  $("back").onclick = () => show("menu");
  $("checkout").onclick = () => {
    if (total() === 0) return;
    $("pay-total").textContent = rupees(total());
    show("payment");
  };
  renderMenu();
</script>
</body>
</html>
