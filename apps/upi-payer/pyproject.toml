[project]
name = "rupeerail-upi-payer"
version = "0.1.0"
description = "Runs next to an ADB-connected phone: watches RupeeRail's OfframpLocked events and pays through UPI Lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["segno>=1.6,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8,<9"]
