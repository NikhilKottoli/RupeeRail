<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RupeeRail Agent</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>RupeeRail Agent</h1>
    <p id="wallet" class="muted">Checking the agent server…</p>
  </header>

  <form id="start-form">
    <label for="goal">What should the agent buy?</label>
    <textarea id="goal" rows="2" placeholder="Order a cutting chai" required maxlength="500"></textarea>
    <label for="max-inr">Spending limit (₹)</label>
    <input id="max-inr" type="number" inputmode="numeric" min="1" step="1" value="1" required>
    <p class="muted">The agent pays without asking, up to this limit. Stop it at any time before it submits.</p>
    <button id="start" type="submit">Start</button>
  </form>

  <button id="stop" class="danger" type="button" hidden>Stop</button>
  <button id="resume" type="button" hidden>I've handled it, continue</button>

  <div id="outcome" role="status" aria-live="polite" hidden></div>

  <img id="shot" alt="Latest view of the page" hidden>
  <ol id="log" aria-label="Agent steps"></ol>

  <script src="panel.js"></script>
</body>
</html>
