[project]
name = "rupeerail-api"
version = "0.1.0"
description = "RupeeRail backend: quotes, paymaster, listener, payout runner, settler and keepers for ScanPayVault"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eth-abi>=5,<6",
    "eth-account>=0.13,<0.14",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.32,<1",
    "web3>=7.6,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: read-only eth_call tests against the live testnet RPCs (deselect with -m 'not live')",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]
